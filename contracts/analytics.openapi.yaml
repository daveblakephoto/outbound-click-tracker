openapi: 3.1.0
info:
  title: StartMyLoveEngine Analytics API
  version: 1.1.0
  description: |
    Contract for analytics collection and reporting.
    Change policy:
      - Minor versions may add fields/endpoints (additive).
      - Breaking changes require a major bump and published deprecation window.
      - Deprecated request fields remain accepted for at least 30 days before removal.
servers:
  - url: https://go.startmyloveengine.com
paths:
  /event:
    options:
      summary: Preflight for generic event ingestion
      responses:
        "204":
          description: CORS preflight
    post:
      summary: Record a generic analytics event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_schema_version:
                  type: string
                  description: schema version tag for producer payload
                site:
                  type: string
                  description: explicit site slug (optional when inferred from Origin)
                vendor:
                  type: string
                  description: optional grouping slug (defaults to unknown)
                event_name:
                  type: string
                  description: event key (for example db_models_page_view)
                event_type:
                  type: string
                  enum: [view, click, submit, error, custom]
                page:
                  type: string
                  description: page slug (for example models-contact)
                session_id:
                  type: string
                  description: session identifier from client
                custom_context:
                  type: object
                  additionalProperties: true
                referrer:
                  type: string
                url:
                  type: string
              required:
                - event_name
                - event_type
                - page
                - session_id
      responses:
        "204":
          description: event recorded
        "400":
          description: validation error
  /visit:
    options:
      summary: Preflight for visit beacon
      responses:
        "204":
          description: CORS preflight
    post:
      summary: Record a visit view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vendor:
                  type: string
                  description: vendor slug
                page:
                  type: string
                  description: page identifier (see contract allowlists)
                tier:
                  type: string
                  description: legacy tier (spotlight|featured|basic|unpaid)
                plan:
                  type: string
                  description: billing plan (unpaid|basic|featured)
                placements:
                  type: array
                  items:
                    type: string
                referrer:
                  type: string
                url:
                  type: string
              required:
                - vendor
                - page
      responses:
        "204":
          description: visit recorded
        "400":
          description: validation error
  /click:
    post:
      summary: Background click increment (no redirect)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vendor:
                  type: string
                type:
                  type: string
                  enum: [website, instagram]
                url:
                  type: string
                  description: current page URL (used for server-side signing)
              required: [vendor, type]
      responses:
        "204":
          description: click recorded
        "400":
          description: invalid input
  /api/stats:
    get:
      summary: Aggregated stats
      parameters:
        - in: query
          name: site
          required: true
          schema:
            type: string
        - in: query
          name: range
          schema:
            type: string
            enum: [7d, 28d, 90d]
            default: 28d
      responses:
        "200":
          description: stats json
          headers:
            X-Data-Source:
              schema:
                type: string
                enum: [ae, cache]
            X-Data-Warning:
              schema:
                type: string
            X-Cache:
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "401":
          description: auth failed
  /api/export/vendor.csv:
    options:
      summary: Preflight for CSV export
      responses:
        "204":
          description: CORS preflight
    get:
      summary: Vendor CSV export
      parameters:
        - in: query
          name: vendor
          required: true
          schema:
            type: string
        - in: query
          name: range
          schema:
            type: string
            enum: [7d, 28d, 90d]
            default: 28d
      responses:
        "200":
          description: CSV payload
          headers:
            X-Data-Source:
              schema:
                type: string
                enum: [ae, cache]
            X-Data-Warning:
              schema:
                type: string
            X-Cache:
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: auth failed
  /api/health/analytics-engine:
    get:
      summary: Analytics Engine health probe
      responses:
        "200":
          description: healthy analytics engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: degraded analytics engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /schema:
    get:
      summary: Analytics contract schema
      responses:
        "200":
          description: contract json
  /openapi:
    get:
      summary: OpenAPI contract document
      responses:
        "200":
          description: OpenAPI yaml
components:
  schemas:
    StatsResponse:
      type: object
      properties:
        dataSource:
          type: string
          enum: [ae, cache]
        dataWarning:
          type: string
    HealthResponse:
      type: object
      required:
        - status
        - latencyMs
        - checkedAt
      properties:
        status:
          type: string
          enum: [ok, degraded]
        latencyMs:
          type: number
        lastError:
          type: string
        checkedAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
