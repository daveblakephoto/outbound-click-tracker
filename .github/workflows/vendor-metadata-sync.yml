name: vendor-metadata-sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [vendor-metadata-sync]
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC

env:
  SOURCE_URL: https://raw.githubusercontent.com/daveblakephoto/startmyloveengine/main/config/vendor-metadata.json
  TARGET_PATH: config/vendor-metadata.json
  COMMIT_MESSAGE: "chore: sync vendor metadata from static site"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download vendor metadata
        run: |
          mkdir -p "$(dirname "$TARGET_PATH")"
          curl -fsSL "$SOURCE_URL" -o "$TARGET_PATH"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- "$TARGET_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_PATH"
          git commit -m "$COMMIT_MESSAGE"
          git push
