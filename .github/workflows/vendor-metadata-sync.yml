name: vendor-metadata-sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [vendor-metadata-sync]
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync vendor metadata
        run: npm run sync:vendor-metadata

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- config/vendor-metadata.json; then
            echo "No changes to vendor-metadata.json"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add config/vendor-metadata.json
          git commit -m "chore: sync vendor-metadata from static site"
          git push
