name = "smle-click-tracker"
main = "src/worker.ts"
compatibility_date = "2026-01-23"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

kv_namespaces = [
  { binding = "CLICKS", id = "103b765eda8a4faba6bf0ac2986874c6" }
]

r2_buckets = [
  { binding = "CLICKS_SNAPSHOTS", bucket_name = "click-snapshots" }
]

[[analytics_engine_datasets]]
binding = "ANALYTICS_ENGINE"
dataset = "analytics_events"

[vars]
ANALYTICS_SITE = "startmyloveengine"
ANALYTICS_ENGINE_DATASET = "analytics_events"
ANALYTICS_ENGINE_ACCOUNT_ID = "cc228d085f9d2bc113bc0a78dd2ea537"
SITE_MAP_JSON = "{\"smle.mocha.app\":\"startmyloveengine\",\"go.startmyloveengine.com\":\"startmyloveengine\",\"startmyloveengine.com\":\"startmyloveengine\"}"

workers_dev = false
preview_urls = false
[triggers]
crons = ["0 3 * * *"]

[env.production]
name = "smle-click-tracker"
route = "go.startmyloveengine.com/*"
kv_namespaces = [
  { binding = "CLICKS", id = "103b765eda8a4faba6bf0ac2986874c6" }
]
r2_buckets = [
  { binding = "CLICKS_SNAPSHOTS", bucket_name = "click-snapshots" }
]
[env.production.vars]
ANALYTICS_SITE = "startmyloveengine"
ANALYTICS_ENGINE_DATASET = "analytics_events"
ANALYTICS_ENGINE_ACCOUNT_ID = "cc228d085f9d2bc113bc0a78dd2ea537"
SITE_MAP_JSON = "{\"smle.mocha.app\":\"startmyloveengine\",\"go.startmyloveengine.com\":\"startmyloveengine\",\"startmyloveengine.com\":\"startmyloveengine\"}"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS_ENGINE"
dataset = "analytics_events"
