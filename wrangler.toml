name = "smle-click-tracker"
main = "src/worker.ts"
compatibility_date = "2026-01-23"

kv_namespaces = [
  { binding = "CLICKS", id = "103b765eda8a4faba6bf0ac2986874c6" }
]

r2_buckets = [
  { binding = "CLICKS_SNAPSHOTS", bucket_name = "click-snapshots" }
]

workers_dev = false
preview_urls = false
[triggers]
crons = ["0 3 * * *"]

[env.production]
name = "smle-click-tracker"
route = "go.startmyloveengine.com/*"
kv_namespaces = [
  { binding = "CLICKS", id = "103b765eda8a4faba6bf0ac2986874c6" }
]
r2_buckets = [
  { binding = "CLICKS_SNAPSHOTS", bucket_name = "click-snapshots" }
]
